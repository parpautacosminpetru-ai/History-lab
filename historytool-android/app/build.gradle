plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'ro.historytool.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'ro.historytool.mobile'
        minSdk 26
        targetSdk 35
        versionCode 10102
        versionName '1.0.2-android'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE.md'] } }
}
chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'fastapi==0.99.1'
            install 'pydantic==1.10.21'
            install 'uvicorn==0.29.0'
            install 'python-multipart==0.0.20'
            install 'pypdf==5.9.0'
        }
    }
}

dependencies {
    // Bundled Latin OCR model works without an external OCR service.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
