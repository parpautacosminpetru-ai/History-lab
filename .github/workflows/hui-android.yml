name: HUI Android APK
on:
  push:
    branches: [main, 'feat/hui-*']
    paths: ['hui/**', '.github/workflows/hui-*.yml']
  pull_request:
    paths: ['hui/**', '.github/workflows/hui-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: python hui/scripts/prepare_reader.py
      - run: flutter pub get
        working-directory: hui/app
      - run: flutter build apk --debug
        working-directory: hui/app
      - run: python hui/scripts/check_android_permissions.py hui/app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HUI-Reader-Android-debug
          path: hui/app/build/app/outputs/flutter-apk/app-debug.apk
