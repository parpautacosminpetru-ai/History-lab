name: HistoryLab · APK offline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Codul sursă
        uses: actions/checkout@v4

      - name: Verifică modelul de date
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Construiește APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Publică APK instalabil
        uses: actions/upload-artifact@v4
        with:
          name: HistoryLab-Atlasul-Explicit-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
