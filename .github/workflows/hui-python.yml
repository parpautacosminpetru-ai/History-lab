name: HUI Python and existing app
on:
  push:
    branches: [main]
    paths: ['hui/indexer/**', 'hui/schemas/**', 'hui/app/assets/**', 'hui/scripts/generate_fixtures.py', '.github/workflows/hui-python.yml', 'AGENTS.md']
  pull_request:
    paths: ['hui/indexer/**', 'hui/schemas/**', 'hui/app/assets/**', 'hui/scripts/generate_fixtures.py', '.github/workflows/hui-python.yml', 'AGENTS.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e "hui/indexer[test]"
      - if: runner.os == 'Linux'
        run: command -v tesseract || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
      - run: python -m pytest hui/indexer/tests --junitxml=hui-test-results.xml -q
      - run: npm test
      - run: python -m hui_indexer.demo --output hui/build/demo
      - run: python -m pip wheel hui/indexer --no-deps --wheel-dir hui/build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: HUI-Indexer-${{ runner.os }}
          path: |
            hui/build/dist/*.whl
            hui/build/demo/demo.hui
            hui-test-results.xml
