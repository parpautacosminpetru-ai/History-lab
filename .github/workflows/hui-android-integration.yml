name: HUI Android offline integration
on:
  pull_request:
    paths: ['hui/app/**', 'hui/scripts/prepare_reader.py', 'hui/scripts/check_android_permissions.py', '.github/workflows/hui-android-integration.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: python hui/scripts/prepare_reader.py
      - name: Allow loopback only for the Flutter test harness (never published)
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          file=Path('hui/app/android/app/src/main/AndroidManifest.xml')
          tree=ET.parse(file)
          android='{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          ET.register_namespace('tools','http://schemas.android.com/tools')
          for item in list(tree.getroot().findall('uses-permission')):
              tree.getroot().remove(item)
          ET.SubElement(tree.getroot(),'uses-permission',{android+'name':'android.permission.INTERNET'})
          tree.write(file,encoding='utf-8',xml_declaration=True)
          PY
      - run: flutter pub get
        working-directory: hui/app
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd hui/app && flutter test integration_test/reader_flow_test.dart -d emulator-5554 --reporter expanded
